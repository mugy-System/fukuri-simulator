<head>
<meta charset="UTF-8">

<title>資産運用シミュレーター</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="資産運用">
<meta name="theme-color" content="#1565C0">
<link rel="icon" id="fav-icon" type="image/png" href="">
<link rel="apple-touch-icon" id="touch-icon" href="">
<script>
(function(){
  function makeIcon(sz){
    var c=document.createElement('canvas');c.width=c.height=sz;
    var g=c.getContext('2d'),s=sz/64;
    var bg=g.createLinearGradient(0,0,sz,sz);
    bg.addColorStop(0,'#1565C0');bg.addColorStop(1,'#42A5F5');
    g.fillStyle=bg;
    g.beginPath();var r=12*s;
    g.moveTo(r,0);g.lineTo(sz-r,0);g.arcTo(sz,0,sz,r,r);
    g.lineTo(sz,sz-r);g.arcTo(sz,sz,sz-r,sz,r);
    g.lineTo(r,sz);g.arcTo(0,sz,0,sz-r,r);
    g.lineTo(0,r);g.arcTo(0,0,r,0,r);g.closePath();g.fill();
    /* 4本の白い棒グラフ（稲妻ジグザグに合わせた高さ） [x, y, height] */
    /* 稲妻: (5,52)→(22,14)→(38,42)→(54,6) に合わせて短・高・短・最高 */
    g.fillStyle='rgba(255,255,255,0.88)';
    [[6,52,6],[19,14,44],[32,42,16],[45,6,52]].forEach(function(a){
      var x=a[0]*s,y=a[1]*s,w=10*s,h=a[2]*s,rr=2*s;
      g.beginPath();
      g.moveTo(x+rr,y);g.lineTo(x+w-rr,y);g.arcTo(x+w,y,x+w,y+rr,rr);
      g.lineTo(x+w,y+h-rr);g.arcTo(x+w,y+h,x+w-rr,y+h,rr);
      g.lineTo(x+rr,y+h);g.arcTo(x,y+h,x,y+h-rr,rr);
      g.lineTo(x,y+rr);g.arcTo(x,y,x+rr,y,rr);
      g.closePath();g.fill();
    });
    /* 赤い稲妻ライン（上→下→上のジグザグ） */
    g.strokeStyle='#E53935';g.lineWidth=3*s;g.lineCap='round';g.lineJoin='round';
    g.beginPath();
    g.moveTo(5*s,52*s);
    g.lineTo(22*s,14*s);
    g.lineTo(38*s,42*s);
    g.lineTo(54*s,6*s);
    g.stroke();
    /* 矢尻（稲妻右端に上向き右方向の矢印） */
    g.fillStyle='#E53935';
    g.beginPath();
    g.moveTo(58*s,3*s);
    g.lineTo(50*s,8*s);
    g.lineTo(52*s,15*s);
    g.closePath();g.fill();
    return c.toDataURL('image/png');
  }
  document.addEventListener('DOMContentLoaded',function(){
    document.getElementById('fav-icon').href=makeIcon(64);
    document.getElementById('touch-icon').href=makeIcon(180);
  });
})();
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;background:linear-gradient(160deg,#daeeff 0%,#b8d9f5 50%,#9ac4e8 100%);min-height:100vh;color:#333;padding-bottom:72px;}

/* ── Tab ── */
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.tab-btn{flex:1;padding:14px;text-align:center;cursor:pointer;font-size:15px;font-weight:bold;color:#aaa;border:none;background:none;border-bottom:3px solid transparent;transition:all .2s;}
.tab-btn.active{color:#1976D2;border-bottom-color:#1976D2;}

/* ── Pages ── */
.page{display:none;}.page.show{display:block;}
.container{max-width:1280px;margin:0 auto;padding:16px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:start;}
/* ── Mobile レスポンシブ ── */
/* ── Card ── */
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.card-title{font-size:15px;font-weight:bold;margin-bottom:14px;color:#222;}

/* ── Input sections ── */
.sec-title{font-size:15px;font-weight:bold;margin:0 0 12px;color:#222;}
.input-section{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #f0f0f0;}
.input-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}

/* Material outlined field */
.mfield{position:relative;border:1px solid #bbb;border-radius:6px;background:#fff;padding:18px 12px 8px;margin-bottom:10px;transition:border-color .2s;}
.mfield:focus-within{border-color:#1976D2;}
.mfield>label{position:absolute;top:5px;left:12px;font-size:11px;color:#888;pointer-events:none;white-space:nowrap;}
.mfield>input{width:100%;border:none;outline:none;font-size:15px;background:transparent;color:#222;}
.mfield .f-row{display:flex;gap:8px;align-items:center;}
.mfield .f-row input{flex:1;min-width:0;border:none;outline:none;font-size:15px;background:transparent;color:#222;}
.mfield .f-row select{flex-shrink:0;border:none;outline:none;font-size:13px;background:transparent;color:#555;cursor:pointer;}
.mfield .ym-row{display:flex;gap:6px;align-items:center;}
.mfield .ym-row input{width:64px;flex:none;border:none;outline:none;font-size:15px;background:transparent;color:#222;}
.mfield .ym-row span{font-size:13px;color:#555;white-space:nowrap;}

/* ── Result cards ── */
.result-stack{display:flex;flex-direction:column;gap:10px;}
.rcard{border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.rcard-head{background:#4fc3f7;color:#fff;padding:9px 14px;font-size:13px;font-weight:bold;text-align:center;}
.rcard-val{padding:11px 14px;font-size:19px;font-weight:bold;text-align:center;background:#fff;color:#222;}
.rcard.orange .rcard-head{background:#ff8c00;}
.rcard.orange .rcard-val{font-size:20px;}

/* ── Action bar（body直下、page外） ── */
.action-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:8px 12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;box-shadow:0 -2px 8px rgba(0,0,0,.12);z-index:200;}
.btn{padding:11px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:bold;transition:opacity .2s;white-space:nowrap;min-height:44px;}
.btn:hover{opacity:.85;}
.btn-gray{background:#9e9e9e;color:#fff;}
.btn-purple{background:#7c4dff;color:#fff;}
.btn-green{background:#43a047;color:#fff;}
.btn-blue{background:#1e88e5;color:#fff;}
.btn-red{background:#e53935;color:#fff;}
.btn-orange{background:#f57c00;color:#fff;}

/* ── プラン追加ダイアログ ── */
.plan-dialog-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;align-items:center;justify-content:center;}
.plan-dialog-overlay.show{display:flex;}
.plan-dialog{background:#fff;border-radius:14px;padding:24px;width:min(420px,92vw);box-shadow:0 8px 32px rgba(0,0,0,.2);}
.plan-dialog h3{font-size:16px;margin-bottom:16px;color:#1976D2;}
.plan-dialog label{font-size:12px;color:#888;display:block;margin-bottom:4px;}
.plan-dialog input[type=text],.plan-dialog textarea{
  width:100%;border:1px solid #ccc;border-radius:8px;
  padding:10px 12px;font-size:14px;margin-bottom:14px;
  font-family:inherit;resize:vertical;
}
.plan-dialog textarea{min-height:80px;}
.plan-dialog .dialog-btns{display:flex;gap:10px;justify-content:flex-end;}

/* ── Toast（alert代替） ── */
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 22px;border-radius:24px;font-size:14px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;}
#toast.show{opacity:1;}

/* ── Chart / Table ── */
.section-hidden{display:none;}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
thead th{background:#ffa726;color:#fff;padding:8px 5px;text-align:center;white-space:nowrap;}
tbody tr:nth-child(odd){background:#fafafa;}
tbody td{padding:6px 5px;text-align:right;border-bottom:1px solid #f0f0f0;white-space:nowrap;}
tbody td:first-child,tbody td:nth-child(2){text-align:center;}

/* ── SubTab（セグメント型） ── */
.sub-tab-bar{display:flex;background:#eef2f7;border-radius:10px;padding:4px;margin-bottom:20px;gap:4px;}
.sub-tab-btn{flex:1;padding:11px 10px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;color:#888;background:transparent;transition:all .2s;}
.sub-tab-btn.active{background:#fff;color:#1976D2;box-shadow:0 2px 8px rgba(0,0,0,.12);}
.sub-page{display:none;}.sub-page.show{display:block;}

/* ── 逆算レイアウト（縦積み） ── */
.rev-card{max-width:760px;margin:0 auto;}
.rev-result-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
@media(max-width:300px){.rev-result-row{grid-template-columns:1fr;}}
.rev-rcard{border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.rev-rcard-head{padding:12px 16px;font-size:14px;font-weight:bold;text-align:center;color:#fff;}
.rev-rcard-val{padding:20px 16px;font-size:32px;font-weight:bold;text-align:center;background:#fff;color:#222;}
.rev-rcard-sub{padding:4px 16px 14px;font-size:12px;text-align:center;background:#fff;color:#888;}
/* 横長カード（逆算結果） */
.rev-rcard-h{display:flex;align-items:stretch;}
.rev-rcard-h .rev-rcard-head{flex:0 0 140px;display:flex;align-items:center;justify-content:center;padding:10px 12px;font-size:13px;}
.rev-rcard-h .rev-rcard-val{flex:1;font-size:26px;padding:10px 16px;display:flex;align-items:center;justify-content:center;}
.rev-rcard-h .rev-rcard-sub{flex:0 0 auto;background:#fff;padding:10px 10px 10px 0;font-size:11px;color:#888;display:flex;align-items:center;}

/* ── Modal（前の画面が上部に見えるシート型） ── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  z-index:500;overflow:hidden;
}
.modal-overlay.show{display:block;}
.modal-box{
  background:#f5f5f5;
  height:calc(100vh - 52px);
  margin:52px 14px 0;
  padding:0;
  border-radius:14px 14px 0 0;
  box-shadow:0 -4px 20px rgba(0,0,0,.2);
  display:flex;flex-direction:column;overflow:hidden;
}
.modal-top{
  display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;
  flex-shrink:0;
  padding:12px 14px;
  background:#f5f5f5;
  border-bottom:1px solid #ddd;
  border-radius:14px 14px 0 0;
}
#planList,#revPlanList{overflow-y:auto;flex:1;padding:14px;}

/* ── 印刷エリア（同タブ印刷用） ── */
#print-area{display:none;}
/* 日付トグル */
.date-toggle{display:flex;align-items:center;gap:5px;font-size:13px;color:#555;cursor:pointer;white-space:nowrap;padding:0 4px;}
.date-toggle input{width:15px;height:15px;cursor:pointer;accent-color:#1976D2;}

@media print{
  body{background:white!important;}
  html,body{overflow:visible!important;max-width:none!important;}
  body>*:not(#print-area){display:none!important;}
  #print-area{display:block!important;font-family:'Hiragino Sans','Meiryo',sans-serif;color:#333;}

  .print-plan{page-break-after:always;padding:2mm 0;}
  .print-plan:last-child{page-break-after:avoid;}

  /* ヘッダー */
  .print-header{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid #1976D2;padding-bottom:8px;margin-bottom:16px;
  }
  .print-header-app{font-size:14px;font-weight:bold;color:#1976D2;}
  .print-header-date{font-size:11px;color:#888;}

  /* タイトル */
  .print-title{
    font-size:26px;font-weight:bold;color:#1976D2;
    margin:0 0 16px;padding-bottom:8px;
  }

  /* メモ */
  .print-memo{
    background:#fffde7;border-left:4px solid #f9a825;
    padding:8px 12px;font-size:12px;margin-bottom:14px;white-space:pre-wrap;border-radius:0 6px 6px 0;
  }

  /* パラメータグリッド */
  .print-params{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px;}
  .print-params span{background:#f0f7ff;border-radius:6px;padding:8px 10px;font-size:12px;text-align:center;}
  .print-params span b{display:block;color:#1976D2;font-size:10px;font-weight:bold;margin-bottom:4px;}

  /* バッジ */
  .print-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .print-badge{background:#1976D2;color:#fff;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:bold;}

  /* チャート */
  .print-chart{width:100%;max-height:230px;margin:0 0 14px;display:block;}

  /* サマリーカード */
  .print-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px;}
  .print-summary div{
    background:#e3f2fd;border:1px solid #90caf9;border-radius:8px;
    padding:12px 8px;font-size:15px;font-weight:bold;text-align:center;
  }
  .print-summary div b{display:block;color:#1976D2;font-size:10px;font-weight:bold;margin-bottom:6px;}
  .print-summary div.hilite{background:#fff8e1;border-color:#ffcc02;}
  .print-summary div.hilite b{color:#f57f17;}

  /* テーブル */
  .print-section-title{
    font-size:12px;font-weight:bold;color:#fff;
    background:#1976D2;padding:6px 12px;border-radius:6px 6px 0 0;
    margin-top:4px;
  }
  .print-table{width:100%;border-collapse:collapse;font-size:11px;}
  .print-table thead th{background:#42a5f5;color:#fff;padding:6px 4px;text-align:center;white-space:nowrap;}
  .print-table tbody tr:nth-child(odd){background:#f5f9ff;}
  .print-table tbody tr:nth-child(even){background:#fff;}
  .print-table tbody td{padding:5px 4px;text-align:right;border-bottom:1px solid #e0e0e0;white-space:nowrap;}
  .print-table tbody td:first-child,.print-table tbody td:nth-child(2){text-align:center;}

  /* 逆算プラン印刷（縦1列・4プラン/ページ） */
  .print-rev-grid{display:grid;grid-template-columns:1fr;gap:5.5mm;margin-top:4mm;break-before:avoid;}
  .print-rev-card{border:1.5px solid #90caf9;border-radius:8px;padding:9px 14px;break-inside:avoid;page-break-inside:avoid;}
  .print-rev-title{font-size:15px;font-weight:bold;color:#1976D2;border-bottom:1.5px solid #90caf9;padding-bottom:5px;margin-bottom:6px;}
  .print-rev-type{font-size:10px;background:#e3f2fd;color:#1976D2;border-radius:10px;padding:2px 9px;display:inline-block;margin-bottom:6px;}
  .print-rev-params{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:7px;}
  .print-rev-params span{background:#f0f7ff;border-radius:5px;padding:5px 7px;font-size:10px;}
  .print-rev-params span b{color:#1976D2;font-size:9px;display:block;font-weight:bold;margin-bottom:2px;}
  .print-rev-result{background:#fff8e1;border:1.5px solid #ffcc02;border-radius:6px;padding:7px 12px;text-align:center;}
  .print-rev-result b{display:block;font-size:11px;color:#f57f17;margin-bottom:3px;}
  .print-rev-result-val{font-size:22px;font-weight:bold;color:#222;}
  .print-rev-memo{font-size:10px;background:#fffde7;border-left:3px solid #f9a825;padding:5px 9px;margin-top:6px;white-space:pre-wrap;border-radius:0 4px 4px 0;}
  @page{size:A4 portrait;margin:0;}
  #print-area{padding:12mm 10mm;}
}
.pcard{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:18px;margin-bottom:14px;}
.pcard-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.pcard-title-input{flex:1;border:1px solid #ccc;border-radius:8px;padding:8px 12px;font-size:15px;}
.pcard-actions{display:flex;gap:8px;}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.icon-btn.iprint{background:#7c4dff;color:#fff;}
.icon-btn.ipdf{background:#f57c00;color:#fff;}
.icon-btn.imemo{background:#00acc1;color:#fff;}
.icon-btn.idel{background:#e53935;color:#fff;}
.icon-btn.ireset{background:#ff8c00;color:#fff;}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.badge{background:#4fc3f7;color:#fff;padding:3px 10px;border-radius:20px;font-size:11px;}
.pcard-info{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#666;margin-bottom:10px;}
.pcard-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;padding:10px;background:#fffde7;border-radius:8px;font-size:12px;text-align:center;}
.pcard-summary div b{display:block;margin-bottom:3px;font-size:11px;}
.memo-area{width:100%;border:1px solid #ccc;border-radius:8px;padding:10px;font-size:13px;min-height:70px;margin-bottom:10px;resize:vertical;}
/* 年次テーブルトグル */
.table-toggle-btn{width:100%;margin-top:10px;padding:8px;border:1px solid #ccc;border-radius:6px;background:#f9f9f9;cursor:pointer;font-size:13px;color:#555;text-align:center;}
.table-toggle-btn:hover{background:#eee;}
.plan-table-wrap{overflow-x:auto;margin-top:8px;}
/* 逆算プランカード（画面） */
.rpcard{background:#fff;border:1px solid #b3d9ff;border-radius:12px;padding:16px;margin-bottom:12px;}
.rpcard-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.rpcard-title-input{flex:1;border:1px solid #ccc;border-radius:8px;padding:8px 12px;font-size:15px;}
.rpcard-type{font-size:11px;background:#e3f2fd;color:#1976D2;border-radius:20px;padding:3px 10px;white-space:nowrap;flex-shrink:0;}
.rpcard-actions{display:flex;gap:8px;}
.rpcard-params{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px;}
.rpcard-param-item{background:#f0f7ff;border-radius:8px;padding:8px 10px;}
.rpcard-param-label{font-size:11px;color:#1976D2;font-weight:bold;margin-bottom:3px;}
.rpcard-param-value{font-size:15px;font-weight:bold;color:#222;}
.rpcard-result{background:#fff8e1;border:1px solid #ffcc02;border-radius:8px;padding:12px;text-align:center;margin-bottom:8px;}
.rpcard-result b{display:block;font-size:12px;color:#f57f17;margin-bottom:4px;}
.rpcard-result-val{font-size:24px;font-weight:bold;color:#222;}

/* ════════════════════════════════
   Mobile レスポンシブ（全ベースCSSの後に配置）
   ════════════════════════════════ */
@media(max-width:480px){
  .btn{padding:9px 12px;font-size:13px;}
  body{padding-bottom:90px;}
}
@media(max-width:640px){
  html,body{overflow-x:hidden;max-width:100%;}
  .container{padding:12px;}
  /* 複利計算：2カラム維持 */
  .two-col{gap:8px;}
  .two-col>*{min-width:0;overflow:hidden;}
  .card{padding:14px 10px;}
  .sec-title{font-size:12px;margin-bottom:7px;}
  .input-section{margin-bottom:10px;padding-bottom:10px;}
  /* 入力欄（複利計算の狭い左カラム用） */
  .mfield{padding:22px 8px 8px;margin-bottom:6px;}
  .mfield>label{font-size:10px;left:8px;}
  .mfield>input,.mfield .f-row input{font-size:16px;}
  .mfield .f-row select{font-size:11px;}
  .mfield .ym-row{gap:2px;}
  .mfield .ym-row input{width:32px;font-size:16px;}
  .mfield .ym-row span{font-size:10px;}
  /* 結果カード（右カラム） */
  .rcard-head{font-size:10px;padding:6px 5px;line-height:1.3;}
  .rcard-val{font-size:13px;padding:7px 5px;}
  .rcard.orange .rcard-head{font-size:10px;}
  .rcard.orange .rcard-val{font-size:13px;}
  .result-stack{gap:5px;}
  /* 逆算：シングルカラム */
  .rev-card.card{display:block;padding:16px;max-width:100%;}
  .rev-card.card .mfield{padding:22px 12px 8px;margin-bottom:10px;}
  .rev-card.card .mfield>label{font-size:11px;left:12px;}
  .rev-card.card .mfield>input,
  .rev-card.card .mfield .f-row input{font-size:16px;}
  .rev-card.card .mfield .f-row select{font-size:13px;}
  .rev-card.card .mfield .ym-row{gap:5px;}
  .rev-card.card .mfield .ym-row input{width:52px;font-size:16px;}
  .rev-card.card .mfield .ym-row span{font-size:13px;}
  /* 逆算の結果カード */
  .rev-result-row{margin-top:10px;gap:7px;}
  .rev-rcard-h .rev-rcard-head{flex:0 0 120px;font-size:12px;padding:8px 10px;}
  .rev-rcard-h .rev-rcard-val{font-size:22px;padding:8px 12px;}

<script>
'use strict';
// ═══════════════════════════════════
//  定数・状態
// ═══════════════════════════════════
const TODAY_YEAR = new Date().getFullYear();
let lastResult   = null;
let mainChartInst = null;
let plans = [];

// localStorage（エラー時は空で続行）
try { plans = JSON.parse(localStorage.getItem('fukuri_plans') || '[]'); } catch(e) {}
function savePlans() { try { localStorage.setItem('fukuri_plans', JSON.stringify(plans)); } catch(e) {} }

let revPlans = [];
try { revPlans = JSON.parse(localStorage.getItem('fukuri_revplans') || '[]'); } catch(e) {}
function saveRevPlans() { try { localStorage.setItem('fukuri_revplans', JSON.stringify(revPlans)); } catch(e) {} }

// ═══════════════════════════════════
//  Toast（alert代替）
// ═══════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════════════════════════════════
//  全角→半角変換
// ═══════════════════════════════════
function toHalf(s) {
  return (s || '')
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．｡。]/g, '.').replace(/[－ー−]/g, '-').replace(/[＋]/g, '+');
}

// ═══════════════════════════════════
//  入力フィルター
// ═══════════════════════════════════
function filterInt(el)  { el.value = toHalf(el.value).replace(/[^0-9]/g, ''); }
function filterMoney(el) {
  let v = toHalf(el.value).replace(/[^0-9.]/g, '');
  const p = v.split('.'); if (p.length > 2) v = p[0] + '.' + p.slice(1).join('');
  el.value = v;
}
function filterRate(el) {
  let v = toHalf(el.value).replace(/[^0-9.\-]/g, '');
  if (v.indexOf('-') > 0) { const n = v.startsWith('-'); v = v.replace(/-/g,''); if(n) v='-'+v; }
  const p = v.split('.'); if (p.length > 2) v = p[0]+'.'+p.slice(1).join('');
  el.value = v;
}
document.addEventListener('compositionend', e => {
  const el = e.target; if (el.tagName !== 'INPUT') return;
  if      (el.dataset.fmt === 'money')   filterMoney(el);
  else if (el.inputMode  === 'decimal')  filterRate(el);
  else if (el.inputMode  === 'numeric')  filterInt(el);
  // inputmode未指定（テキスト入力）はフィルター不要
}, true);

// ═══════════════════════════════════
//  フォーカス / ブラー
// ═══════════════════════════════════
function onFocus(el)    { const r = el.value.replace(/,/g,''); el.value = (r==='0'||r==='')?'':r; }
function onBlurMoney(el){
  const v = parseFloat(toHalf(el.value).replace(/,/g,'')) || 0;
  el.value = (v === Math.floor(v)) ? v.toLocaleString('ja-JP') : parseFloat(v.toFixed(4)).toString();
}
function onBlurInt(el)  { el.value = String(parseInt(toHalf(el.value),10)||0); }
function onBlurRate(el) { el.value = String(parseFloat(toHalf(el.value))||0); }

// ═══════════════════════════════════
//  値の読み取り
// ═══════════════════════════════════
function gv(id) {
  const el = document.getElementById(id);
  return el ? (parseFloat(toHalf(el.value).replace(/,/g,'')) || 0) : 0;
}
function gu(iid, uid) { return gv(iid) * (parseFloat((document.getElementById(uid)||{}).value)||1); }
function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }

// ═══════════════════════════════════
//  Tab / SubTab
// ═══════════════════════════════════
function switchTab(t) {
  document.querySelectorAll('.tab-btn').forEach((b,i) =>
    b.classList.toggle('active', (i===0&&t==='calc')||(i===1&&t==='reverse')));
  document.getElementById('page-calc').classList.toggle('show', t==='calc');
  document.getElementById('page-reverse').classList.toggle('show', t==='reverse');
  document.getElementById('bar-calc').style.display    = (t==='calc')    ? '' : 'none';
  document.getElementById('bar-reverse').style.display = (t==='reverse') ? '' : 'none';
}
function switchSubTab(s) {
  document.querySelectorAll('.sub-tab-btn').forEach((b,i) =>
    b.classList.toggle('active', (i===0&&s==='revRate')||(i===1&&s==='revAmt')));
  document.getElementById('sub-revRate').classList.toggle('show', s==='revRate');
  document.getElementById('sub-revAmt').classList.toggle('show', s==='revAmt');
}

// ═══════════════════════════════════
//  Calculation core
// ═══════════════════════════════════
function computePlan(p) {
  const totalAccumM = p.accumYears * 12 + p.accumMonths;
  const totalMgmtM  = p.mgmtYears  * 12 + p.mgmtMonths;
  // 年複利を月換算: (1+r)^(1/12) - 1
  const mr1 = Math.pow(1 + p.accumRate / 100, 1/12) - 1;
  const mr2 = Math.pow(1 + p.mgmtRate  / 100, 1/12) - 1;
  const mr3 = Math.pow(1 + p.wdRate    / 100, 1/12) - 1;

  let balance = p.initialInv, cumInv = p.initialInv;
  let prevCumInv = 0, prevIncome = 0, cumWd = 0, yearNum = 0;
  const rows = [];

  // Phase 1: 積立
  for (let m = 1; m <= totalAccumM; m++) {
    balance = balance * (1 + mr1) + p.monthly;
    cumInv += p.monthly;
    if ((m % 12 === 0) || (m === totalAccumM)) {
      yearNum++;
      const inc = balance - cumInv;
      rows.push({ year:yearNum, refYear:TODAY_YEAR+yearNum-1,
        annInv:Math.round(cumInv-prevCumInv), cumInv:Math.round(cumInv),
        annIncome:Math.round(inc-prevIncome), annWd:0, cumWd:0,
        principal:Math.round(cumInv), incomeBalance:Math.round(inc), total:Math.round(balance) });
      prevCumInv = cumInv; prevIncome = inc;
    }
  }
  const balAfterAccum = balance;

  // Phase 2: 運用
  for (let m = 1; m <= totalMgmtM; m++) {
    balance = balance * (1 + mr2);
    if ((m % 12 === 0) || (m === totalMgmtM)) {
      yearNum++;
      const inc = balance - cumInv;
      rows.push({ year:yearNum, refYear:TODAY_YEAR+yearNum-1,
        annInv:0, cumInv:Math.round(cumInv),
        annIncome:Math.round(inc-prevIncome), annWd:0, cumWd:0,
        principal:Math.round(cumInv), incomeBalance:Math.round(inc), total:Math.round(balance) });
      prevIncome = inc;
    }
  }
  const balAfterMgmt = balance;

  // 一括引落
  balance -= p.lumpSum; cumWd += p.lumpSum;

  // Phase 3: 引落
  for (let y = 1; y <= p.wdYears; y++) {
    for (let m = 1; m <= 12; m++) balance = balance * (1 + mr3);
    const wd = p.wdMethod==='fixed' ? p.wdAmount : balance*(p.wdAmount/100);
    balance -= wd; cumWd += wd; yearNum++;
    const pr = Math.max(0, cumInv - cumWd);
    rows.push({ year:yearNum, refYear:TODAY_YEAR+yearNum-1,
      annInv:0, cumInv:Math.round(cumInv),
      annIncome:0, annWd:Math.round(wd), cumWd:Math.round(cumWd),
      principal:Math.round(pr), incomeBalance:Math.round(Math.max(0,balance-pr)), total:Math.round(balance) });
  }

  return { totalInv:Math.round(cumInv), balAfterAccum:Math.round(balAfterAccum),
    balAfterMgmt:Math.round(balAfterMgmt), income:Math.round(balAfterMgmt-cumInv),
    totalWd:Math.round(cumWd), finalBal:Math.round(balance),
    startYear:TODAY_YEAR, endYear:TODAY_YEAR+yearNum-1, yearNum, rows, params:p };
}

function getParams() {
  return {
    accumYears:gv('accumYears'), accumMonths:gv('accumMonths'),
    initialInv:gu('initialInv','initialUnit'), monthly:gu('monthly','monthlyUnit'),
    accumRate:gv('accumRate'), mgmtYears:gv('mgmtYears'), mgmtMonths:gv('mgmtMonths'),
    mgmtRate:gv('mgmtRate'), wdYears:gv('wdYears'), wdRate:gv('wdRate'),
    lumpSum:gu('lumpSum','lumpSumUnit'), wdMethod:document.getElementById('wdMethod').value,
    wdAmount:gu('wdAmount','wdUnit')
  };
}

function calculate() {
  try {
    const r = computePlan(getParams());
    lastResult = r;
    document.getElementById('r1').textContent = fmt(r.totalInv)      + ' 円';
    document.getElementById('r2').textContent = fmt(r.balAfterAccum) + ' 円';
    document.getElementById('r3').textContent = fmt(r.balAfterMgmt)  + ' 円';
    document.getElementById('r4').textContent = fmt(r.income)        + ' 円';
    document.getElementById('r5').textContent = fmt(r.totalWd)       + ' 円';
    document.getElementById('r6').textContent = fmt(r.finalBal)      + ' 円';
    document.getElementById('r7').textContent = r.yearNum > 0
      ? `${r.startYear}〜${r.endYear}` : `${TODAY_YEAR}〜`;
    if (r.rows.length > 0) {
      renderChart(r.rows); renderTable(r.rows);
      document.getElementById('chartCard').classList.remove('section-hidden');
      document.getElementById('tableCard').classList.remove('section-hidden');
    }
  } catch(e) { showToast('計算エラー: ' + e.message); }
}

// ── 印刷コンテンツ制御（beforeprint/afterprint）──

  if (_printHTML) document.getElementById('print-area').innerHTML = _printHTML;

});

// ═══════════════════════════════════
//  逆算
// ═══════════════════════════════════
function fvFromMonthly(pmt, totalMonths, annualRate, mgmtMonths) {
  const mr = Math.pow(1 + annualRate/100, 1/12) - 1;
  let bal = 0;
  for (let m=0; m<totalMonths; m++) bal = bal*(1+mr)+pmt;
  for (let m=0; m<mgmtMonths;  m++) bal = bal*(1+mr);
  return bal;
}
function calcRevRate() {
  const target  = gu('rv1-target','rv1-tunit');
  const accumM  = gv('rv1-years')*12 + gv('rv1-months');
  const monthly = gu('rv1-monthly','rv1-munit');
  const mgmtM   = gv('rv1-mgmt-y')*12 + gv('rv1-mgmt-m');
  const d = document.getElementById('rv1-total-disp');
  if (d) d.textContent = fmt(monthly * accumM) + ' 円';
  const resEl = document.getElementById('rv1-result');
  if (!target || !accumM) { resEl.textContent='－'; return; }
  let lo=-50, hi=100;
  for (let i=0;i<200;i++) {
    const mid=(lo+hi)/2;
    fvFromMonthly(monthly,accumM,mid,mgmtM)<target ? lo=mid : hi=mid;
  }
  const rate = (lo+hi)/2;
  if (rate >= 99) { resEl.textContent='－'; return; }
  const display = Math.abs(rate) < 0.005 ? 0 : rate; // -0.00 → 0.00 補正
  resEl.textContent = display.toFixed(2) + ' %';
}
function calcRevAmt() {
  const target = gu('rv2-target','rv2-tunit');
  const accumM = gv('rv2-years')*12 + gv('rv2-months');
  const rate   = gv('rv2-rate');
  const mgmtM  = gv('rv2-mgmt-y')*12 + gv('rv2-mgmt-m');
  const resEl  = document.getElementById('rv2-result');
  if (!target || !accumM) { resEl.textContent='－'; return; }
  const factor = fvFromMonthly(1, accumM, rate, mgmtM);
  resEl.textContent = factor ? fmt(Math.ceil(target/factor)) + ' 円' : '－';
}
function resetReverse() {
  ['rv1-target','rv1-years','rv1-months','rv1-monthly','rv1-mgmt-y','rv1-mgmt-m',
   'rv2-target','rv2-years','rv2-months','rv2-rate','rv2-mgmt-y','rv2-mgmt-m']
    .forEach(id => { const el=document.getElementById(id); if(el) el.value='0'; });
  const d1=document.getElementById('rv1-total-disp'); if(d1) d1.textContent='0 円';
  document.getElementById('rv1-result').textContent='－';
  document.getElementById('rv2-result').textContent='－';
}

  if (isRate) {
    const result = document.getElementById('rv1-result').textContent;
    if (!result || result === '－') { showToast('先に条件を入力してください'); return; }
    plan = {
      id: Date.now(), title: 'プラン' + (revPlans.length + 1), memo: '',
      type: 'rate',
      params: {
        target:  gu('rv1-target','rv1-tunit'),
        accumY:  gv('rv1-years'), accumMo: gv('rv1-months'),
        monthly: gu('rv1-monthly','rv1-munit'),
        mgmtY:   gv('rv1-mgmt-y'), mgmtMo: gv('rv1-mgmt-m'),
        total:   document.getElementById('rv1-total-disp').textContent
      },
      result: result, resultLabel: '必要利回り（年複利）'
    };
  } else {
    const result = document.getElementById('rv2-result').textContent;
    if (!result || result === '－') { showToast('先に条件を入力してください'); return; }
    plan = {
      id: Date.now(), title: 'プラン' + (revPlans.length + 1), memo: '',
      type: 'amount',
      params: {
        target:  gu('rv2-target','rv2-tunit'),
        accumY:  gv('rv2-years'), accumMo: gv('rv2-months'),
        rate:    gv('rv2-rate'),
        mgmtY:   gv('rv2-mgmt-y'), mgmtMo: gv('rv2-mgmt-m')
      },
      result: result, resultLabel: '必要積立額（月）'
    };
  }
  revPlans.push(plan);
  saveRevPlans();
  showToast('プランを追加しました（' + plan.title + '）');
}

function openRevPlans() {
  renderRevPlanList();
  document.getElementById('revPlanModal').classList.add('show');
}
function closeRevPlans() { document.getElementById('revPlanModal').classList.remove('show'); }

function renderRevPlanList() {
  const el = document.getElementById('revPlanList');
  if (!revPlans.length) {
    el.innerHTML = '<p style="text-align:center;padding:40px;color:#999;">保存されたプランがありません</p>';
    return;
  }
  el.innerHTML = revPlans.map(p => {
    const pa = p.params;
    const typeLabel = p.type === 'rate' ? '📈 必要利回り' : '💰 必要積立額';
    const pi = (label, value) => `<div class="rpcard-param-item"><div class="rpcard-param-label">${label}</div><div class="rpcard-param-value">${value}</div></div>`;
    const paramsHTML = p.type === 'rate'
      ? pi('目標金額', `¥${fmt(pa.target)}`) +
        pi('積立期間', `${pa.accumY}年${pa.accumMo ? pa.accumMo+'ヶ月' : ''}`) +
        pi('毎月積立額', `¥${fmt(pa.monthly)}`) +
        pi('運用期間', `${pa.mgmtY}年${pa.mgmtMo ? pa.mgmtMo+'ヶ月' : ''}`) +
        pi('積立総額', pa.total)
      : pi('目標金額', `¥${fmt(pa.target)}`) +
        pi('積立期間', `${pa.accumY}年${pa.accumMo ? pa.accumMo+'ヶ月' : ''}`) +
        pi('年利', `${pa.rate}%`) +
        pi('運用期間', `${pa.mgmtY}年${pa.mgmtMo ? pa.mgmtMo+'ヶ月' : ''}`);
    return `
    <div class="rpcard" id="rpcard-${p.id}">
      <div class="rpcard-header">
        <input class="rpcard-title-input" type="text" value="${p.title.replace(/"/g,'&quot;')}"
          onchange="updateRevTitle(${p.id},this.value)">
        <span class="rpcard-type">${typeLabel}</span>
        <div class="rpcard-actions">
          <button class="icon-btn iprint"  onclick="printRevPlan(${p.id})"      title="印刷">🖨️</button>
          <button class="icon-btn imemo"   onclick="toggleRevMemo(${p.id})"     title="コメント">📝</button>
          <button class="icon-btn ireset"  onclick="resetRevPlanTitle(${p.id})" title="プラン名リセット">🔄</button>
          <button class="icon-btn idel"    onclick="deleteRevPlan(${p.id})"     title="削除">🗑️</button>
        </div>
      </div>
      <div class="rpcard-params">${paramsHTML}</div>
      <div class="rpcard-result">
        <b>${p.resultLabel}</b>
        <div class="rpcard-result-val">${p.result}</div>
      </div>
      <div id="rev-memo-box-${p.id}" style="display:${p.memo ? '' : 'none'}">
        <textarea class="memo-area" placeholder="コメントを入力"
          onchange="updateRevMemo(${p.id},this.value)">${p.memo}</textarea>
      </div>
    </div>`;
  }).join('');
}

function updateRevTitle(id, v) { const p=revPlans.find(x=>x.id===id); if(p){p.title=v;saveRevPlans();} }
function updateRevMemo(id, v)  { const p=revPlans.find(x=>x.id===id); if(p){p.memo=v;saveRevPlans();} }
function toggleRevMemo(id) {
  const el = document.getElementById(`rev-memo-box-${id}`);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? '' : 'none';
}
function deleteRevPlan(id) {
  if (!confirm('このプランを削除しますか？')) return;
  revPlans = revPlans.filter(p => p.id !== id);
  saveRevPlans(); renderRevPlanList();
}
function deleteAllRevPlans() {
  if (!confirm('逆算プランを全て削除しますか？')) return;
  revPlans = []; saveRevPlans(); renderRevPlanList();
}
function resetRevPlanTitle(id) {
  const p = revPlans.find(x => x.id === id); if (!p) return;
  p.title = 'プラン' + (revPlans.indexOf(p) + 1);
  saveRevPlans(); renderRevPlanList();
}
function resetAllRevPlanTitles() {
  revPlans.forEach((p, i) => { p.title = 'プラン' + (i + 1); });
  saveRevPlans(); renderRevPlanList();
}

function buildRevPrintCard(p) {
  const pa = p.params;
  const typeLabel = p.type === 'rate' ? '📈 必要利回り' : '💰 必要積立額';
  const paramsHTML = p.type === 'rate'
    ? `<span><b>目標金額</b>¥${fmt(pa.target)}</span>
       <span><b>積立期間</b>${pa.accumY}年${pa.accumMo ? pa.accumMo+'ヶ月' : ''}</span>
       <span><b>毎月積立</b>¥${fmt(pa.monthly)}</span>
       <span><b>運用期間</b>${pa.mgmtY}年${pa.mgmtMo ? pa.mgmtMo+'ヶ月' : ''}</span>
       <span><b>積立総額</b>${pa.total}</span>`
    : `<span><b>目標金額</b>¥${fmt(pa.target)}</span>
       <span><b>積立期間</b>${pa.accumY}年${pa.accumMo ? pa.accumMo+'ヶ月' : ''}</span>
       <span><b>年利</b>${pa.rate}%</span>
       <span><b>運用期間</b>${pa.mgmtY}年${pa.mgmtMo ? pa.mgmtMo+'ヶ月' : ''}</span>`;
  const memoHTML = p.memo
    ? `<div class="print-rev-memo">${p.memo.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>` : '';
  return `
    <div class="print-rev-card">
      <div class="print-rev-title">${p.title.replace(/</g,'&lt;')}</div>
      <div class="print-rev-type">${typeLabel}</div>
      <div class="print-rev-params">${paramsHTML}</div>
      <div class="print-rev-result">
        <b>${p.resultLabel}</b>
        <div class="print-rev-result-val">${p.result}</div>
      </div>
      ${memoHTML}
    </div>`;
}

function printRevPlan(id) {
  const p = revPlans.find(x => x.id === id);
  if (!p) return;
  const dateStr = getDateStr('rev-list-date-chk');
  const hdr = `<div class="print-header">
    <div class="print-header-app">資産運用シミュレーター（逆算）</div>
    ${dateStr ? `<div class="print-header-date">${dateStr}</div>` : ''}
  </div>`;
  execPrint(`<div class="print-plan">${hdr}<div class="print-rev-grid">${buildRevPrintCard(p)}</div></div>`);
}

function printRevPlans() {
  if (!revPlans.length) { showToast('プランがありません'); return; }
  const dateStr = getDateStr('rev-list-date-chk');

  // 常に4プラン/ページ固定
  const chunks = [];
  for (let i = 0; i < revPlans.length; i += 4) chunks.push(revPlans.slice(i, i + 4));

  const html = chunks.map(group => {
    const hdr = `<div class="print-header">
      <div class="print-header-app">資産運用シミュレーター（逆算）</div>
      ${dateStr ? `<div class="print-header-date">${dateStr}</div>` : ''}
    </div>`;
    const cards = group.map(buildRevPrintCard).join('');
    return `<div class="print-plan">${hdr}<div class="print-rev-grid">${cards}</div></div>`;
  }).join('');
  execPrint(html);
}
</script>
</body>
</html>
